<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photographer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
  <!-- Logout button top right -->
  <div class="flex justify-end mb-4">
    <button onclick="logout()"
      class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg shadow">
      🔓 Logout
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-center text-blue-700">📷 Photographer Dashboard</h1>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-4 shadow-sm">
      <h3 class="text-xl font-semibold mb-2">🗓️ My Assigned Jobs</h3>
      <p class="text-gray-700 mb-4">View upcoming photography jobs assigned to you.</p>
      <button
        onclick="location.href='css_photographer_jobs.html'"
        class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-md transition duration-200">
        View Jobs
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
  <script>
    async function logout() {
      const { error } = await supabase.auth.signOut();
      if (error) {
        alert('Logout failed: ' + error.message);
      } else {
        window.location.href = 'css_photographer_login.html';
      }
    }
  </script>
</body>
</html>
